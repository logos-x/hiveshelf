version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/apps/*", "/packages/*"]
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-request-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    groups:
      actions:
        update-types: [minor, patch]
