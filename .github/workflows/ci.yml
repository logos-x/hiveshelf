name: CI
on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: postgresql://hiveshelf:hiveshelf_ci@localhost:5432/hiveshelf
  DATABASE_URL_TEST: postgresql://hiveshelf:hiveshelf_ci@localhost:5432/hiveshelf_test
  PORT: "3001"
  NEXT_PUBLIC_API_URL: http://localhost:3001
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  API_INTERNAL_URL: http://localhost:3001

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Check environment configuration
        run: pnpm --filter @hiveshelf/api env:check
        env:
          NODE_ENV: test

      - name: Run checks
        run: pnpm turbo run lint typecheck build --cache-dir=.turbo

      - name: Run API unit tests
        run: pnpm --filter @hiveshelf/api test
        env:
          NODE_ENV: test

      - name: Start integration infrastructure
        run: |
          docker compose up -d --wait minio mailpit
          docker compose run --rm minio-init

      - name: Run API integration tests and smoke
        run: |
          pnpm --filter @hiveshelf/api test:int
          pnpm dev:smoke
        env:
          NODE_ENV: test
          STORAGE_DRIVER: s3
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: hiveshelf-dev
          S3_ACCESS_KEY: hiveshelf
          S3_SECRET_KEY: hiveshelf_dev_secret
          S3_FORCE_PATH_STYLE: "true"
          EMAIL_DRIVER: smtp
          SMTP_HOST: localhost
          SMTP_PORT: "1025"
          MAIL_FROM: "HiveShelf <no-reply@hiveshelf.local>"
          MAILPIT_UI_PORT: "8025"

      - name: Run API E2E tests
        run: pnpm --filter @hiveshelf/api test:e2e
        env:
          NODE_ENV: test

      - name: Smoke with memory drivers
        run: pnpm dev:smoke
        env:
          NODE_ENV: test
          STORAGE_DRIVER: memory
          EMAIL_DRIVER: memory
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hiveshelf
          POSTGRES_PASSWORD: hiveshelf_ci
          POSTGRES_DB: hiveshelf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hiveshelf -d hiveshelf_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
