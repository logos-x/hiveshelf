name: CI
on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: postgresql://test:test@localhost:5432/hiveshelf_test
  PORT: "3001"
  NEXT_PUBLIC_API_URL: http://localhost:3001
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  API_INTERNAL_URL: http://localhost:3001

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Check environment configuration
        run: pnpm --filter @hiveshelf/api env:check
        env:
          NODE_ENV: test

      - name: Run checks
        run: pnpm turbo run lint typecheck build --cache-dir=.turbo

      - name: Run API unit tests
        run: pnpm --filter @hiveshelf/api test
        env:
          NODE_ENV: test

      - name: Run API E2E tests
        run: pnpm --filter @hiveshelf/api test:e2e
        env:
          NODE_ENV: test
